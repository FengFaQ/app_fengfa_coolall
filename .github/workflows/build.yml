name: 构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端检查：类型检查 + 构建
  check-frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # Rust 核心测试
  #
  # 协议逻辑已拆到独立 crate `crates/coolall-core`，不依赖 tauri / GUI，
  # 因此无需安装 WebKitGTK 等系统库即可完整跑测试。
  test-rust:
    name: Rust 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/coolall-core

      - name: 运行核心单元测试
        run: cargo test --manifest-path crates/coolall-core/Cargo.toml

  # Windows 打包
  build-windows:
    name: Windows 打包
    needs: [check-frontend, test-rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建
        run: npm run tauri:build

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi |
            Select-Object FullName, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: coolall-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/coolall.exe
          if-no-files-found: error
          retention-days: 14
