name: 构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑静态检查，失败则不出包
  check:
    name: 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: npm test -- --run

      - name: 前端构建
        run: npm run build

  # Rust 协议层测试（跨平台验证算法一致性）
  test-rust:
    name: Rust 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 运行单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release

  # Windows 打包
  build-windows:
    name: Windows 打包
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: coolall-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/coolall.exe
          if-no-files-found: warn
          retention-days: 14
