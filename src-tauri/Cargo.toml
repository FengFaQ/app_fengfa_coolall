[package]
name = "coolall"
version = "0.1.0"
description = "基于 Tauri 2 与 Vue 3 的非官方酷安客户端"
authors = ["FengFaQ"]
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/FengFaQ/app_fengfa_coolall"

[lib]
name = "coolall_lib"
# 桌面端用 rlib；staticlib/cdylib 供移动端（Android/iOS）使用。
# 注：曾怀疑多 crate-type 导致 #[tauri::command] 的 E0255，
# 实测证明无关——根因是命令函数直接定义在 lib.rs 里。
# 真正的修法是把命令移到 commands.rs 子模块。
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"

# 协议核心：签名、设备身份、请求头、错误分类（不含 GUI 依赖）
coolall-core = { path = "../crates/coolall-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# HTTP：关闭默认 TLS，改用 rustls 避免 OpenSSL 构建依赖
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "gzip",
  "rustls-tls",
  "stream",
] }
tokio = { version = "1", features = ["full"] }

chrono = "0.4"
urlencoding = "2"
# WebviewUrl::External 需要 url::Url
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 注意：release profile 必须写在 workspace 根（见 ../../Cargo.toml），
# 写在这里会被 cargo 忽略并发出警告。



